services:
  keycloak-db:
    image: postgres:15-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloakdb}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD_is_required}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  keycloak:
    build: .
    container_name: auth-service-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloakdb}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD_is_required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME_is_required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD_is_required}
      JC_CLIENT_SECRET: ${JC_CLIENT_SECRET:?JC_CLIENT_SECRET_is_required}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "8180:8080"
      - "9000:9000"
    healthcheck:
      test: >-
        exec 3<>/dev/tcp/localhost/9000 &&
        echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
        cat <&3 | grep -q '200 OK'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - auth-network

networks:
  auth-network:
    name: jacapp-auth-network
    driver: bridge

volumes:
  keycloak_db_data:
